<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock - Multiple Time Zones</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: rgba(0, 0, 0, 0.8);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            max-width: 900px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #fff;
            margin-bottom: 40px;
            font-size: 32px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .clocks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .clock-card {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            border: 2px solid #667eea;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .clock-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
        }

        .timezone-name {
            color: #667eea;
            font-size: 14px;
            margin-bottom: 10px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .time-display {
            font-size: 32px;
            color: #00ff88;
            font-weight: bold;
            margin-bottom: 8px;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
        }

        .date-display {
            font-size: 12px;
            color: #b0c4de;
            font-family: 'Courier New', monospace;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .time-format-toggle {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .format-btn {
            padding: 8px 16px;
            font-size: 12px;
            background: rgba(102, 126, 234, 0.3);
            border: 2px solid #667eea;
            color: #667eea;
        }

        .format-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #764ba2;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 24px;
                margin-bottom: 20px;
            }

            .clocks-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .time-display {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🕐 Digital Clock</h1>
        
        <div class="clocks-grid" id="clocksContainer"></div>

        <div class="time-format-toggle">
            <button class="format-btn active" onclick="setTimeFormat('24')">24 Hour</button>
            <button class="format-btn" onclick="setTimeFormat('12')">12 Hour</button>
        </div>

        <div class="controls">
            <button onclick="addTimezone()">➕ Add Timezone</button>
            <button onclick="resetTimezones()">🔄 Reset</button>
            <button onclick="clearAllTimezones()">🗑️ Clear All</button>
        </div>
    </div>

    <script>
        const DEFAULT_TIMEZONES = [
            { name: 'New York', tz: 'America/New_York' },
            { name: 'London', tz: 'Europe/London' },
            { name: 'Tokyo', tz: 'Asia/Tokyo' },
            { name: 'Sydney', tz: 'Australia/Sydney' },
            { name: 'Dubai', tz: 'Asia/Dubai' },
            { name: 'Singapore', tz: 'Asia/Singapore' }
        ];

        let timezones = [];
        let timeFormat = '24';

        const ALL_TIMEZONES = [
            { name: 'New York', tz: 'America/New_York' },
            { name: 'Los Angeles', tz: 'America/Los_Angeles' },
            { name: 'Chicago', tz: 'America/Chicago' },
            { name: 'Denver', tz: 'America/Denver' },
            { name: 'London', tz: 'Europe/London' },
            { name: 'Paris', tz: 'Europe/Paris' },
            { name: 'Berlin', tz: 'Europe/Berlin' },
            { name: 'Moscow', tz: 'Europe/Moscow' },
            { name: 'Dubai', tz: 'Asia/Dubai' },
            { name: 'India', tz: 'Asia/Kolkata' },
            { name: 'Bangkok', tz: 'Asia/Bangkok' },
            { name: 'Singapore', tz: 'Asia/Singapore' },
            { name: 'Hong Kong', tz: 'Asia/Hong_Kong' },
            { name: 'Tokyo', tz: 'Asia/Tokyo' },
            { name: 'Seoul', tz: 'Asia/Seoul' },
            { name: 'Sydney', tz: 'Australia/Sydney' },
            { name: 'Auckland', tz: 'Pacific/Auckland' },
            { name: 'Fiji', tz: 'Pacific/Fiji' },
            { name: 'São Paulo', tz: 'America/Sao_Paulo' },
            { name: 'Mexico City', tz: 'America/Mexico_City' }
        ];

        function initializeClock() {
            timezones = [...DEFAULT_TIMEZONES];
            renderClocks();
            updateClocks();
            setInterval(updateClocks, 1000);
        }

        function renderClocks() {
            const container = document.getElementById('clocksContainer');
            container.innerHTML = '';
            
            timezones.forEach((tz, index) => {
                const card = document.createElement('div');
                card.className = 'clock-card';
                card.innerHTML = `
                    <div class="timezone-name">${tz.name}</div>
                    <div class="time-display" data-index="${index}">--:--:--</div>
                    <div class="date-display" data-date-index="${index}">-</div>
                    <button style="margin-top: 10px; padding: 6px 12px; font-size: 12px;" onclick="removeTimezone(${index})">Remove</button>
                `;
                container.appendChild(card);
            });
        }

        function updateClocks() {
            timezones.forEach((tz, index) => {
                const time = new Date().toLocaleString('en-US', {
                    timeZone: tz.tz,
                    hour: timeFormat === '12' ? '2-digit' : '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: timeFormat === '12'
                });

                const date = new Date().toLocaleString('en-US', {
                    timeZone: tz.tz,
                    weekday: 'short',
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric'
                });

                const timeDisplay = document.querySelector(`[data-index="${index}"]`);
                const dateDisplay = document.querySelector(`[data-date-index="${index}"]`);
                
                if (timeDisplay) timeDisplay.textContent = time;
                if (dateDisplay) dateDisplay.textContent = date;
            });
        }

        function addTimezone() {
            const availableTz = ALL_TIMEZONES.filter(tz => 
                !timezones.find(t => t.tz === tz.tz)
            );

            if (availableTz.length === 0) {
                alert('All timezones are already added!');
                return;
            }

            const tzNames = availableTz.map(tz => tz.name).join('\n');
            const selected = prompt(`Available timezones:\n\n${tzNames}\n\nEnter timezone name:`, availableTz[0].name);

            if (selected) {
                const tz = availableTz.find(t => t.name.toLowerCase() === selected.toLowerCase());
                if (tz) {
                    timezones.push(tz);
                    renderClocks();
                    updateClocks();
                } else {
                    alert('Timezone not found!');
                }
            }
        }

        function removeTimezone(index) {
            timezones.splice(index, 1);
            renderClocks();
        }

        function resetTimezones() {
            timezones = [...DEFAULT_TIMEZONES];
            renderClocks();
            updateClocks();
        }

        function clearAllTimezones() {
            if (confirm('Are you sure you want to clear all timezones?')) {
                timezones = [];
                renderClocks();
            }
        }

        function setTimeFormat(format) {
            timeFormat = format;
            document.querySelectorAll('.format-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            updateClocks();
        }

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', initializeClock);
    </script>
</body>
</html>
